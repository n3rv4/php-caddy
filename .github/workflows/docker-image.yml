name: Docker Image CI

on:
  push:
    branches: [ "8.5" ]
  pull_request:
    branches: [ "8.5" ]
  # Rebuild hebdomadaire : sans lui, l'image publiée reste figée sur les
  # versions de paquets du jour du dernier commit et accumule les CVE.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (multi-arch)
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to DHI registry (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Cache Docker layers
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build and push Docker image (multi-arch + cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            n3rv4/php-caddy:8.5
            n3rv4/php-caddy:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          # Sur un rebuild programmé ou manuel, on repart de zéro : réutiliser le
          # cache resservirait la couche `apk upgrade` et annulerait tout l'intérêt.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          pull: true
          cache-from: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'type=local,src=/tmp/.buildx-cache' || '' }}
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'type=local,dest=/tmp/.buildx-cache' || '' }}
